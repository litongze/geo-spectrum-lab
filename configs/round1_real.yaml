# Round 1 — real competition data (Round1_Map(2)/).
# Trains the PathField baseline on CPU. Tune n_paths/epochs to push accuracy.

data:
  datadir: "Round1_Map(2)"
  scaler_mode: std

model:
  name: path_field
  n_paths: 256          # CP rank (propagation modes)
  n_freqs: 10
  hidden_dim: 256
  n_layers: 4

train:
  epochs: 200
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.0
  lambda_pas: 1.0
  lambda_pdp: 1.0
  val_fraction: 0.1
  grad_clip: 1.0
  num_workers: 0
  log_every: 5
  seed: 0
  device: cpu

output:
  ckpt: checkpoints/round1_real.pt
