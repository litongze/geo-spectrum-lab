# Round 1 — NeRF2-style neural radiance field (volume rendering -> H), GPU.
data:
  datadir: "Round1_Map(2)"
  scaler_mode: std

model:
  name: nerf2
  n_samples: 48
  near: 1.0
  far: 400.0
  hidden_dim: 128
  n_freqs: 10

train:
  epochs: 150
  batch_size: 64
  lr: 1.0e-3
  loss_name: competition
  weight_decay: 0.0
  lambda_pas: 1.0
  lambda_pdp: 1.0
  lambda_mag: 0.0
  val_fraction: 0.1
  grad_clip: 1.0
  num_workers: 0
  log_every: 25
  seed: 0
  device: cuda

output:
  ckpt: checkpoints/round1_nerf2.pt
