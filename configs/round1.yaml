# Configuration for Round 1 of the Physical-AI channel-generation challenge.
# Override any value on the command line, e.g.:
#   python scripts/train.py --config configs/round1.yaml --set train.epochs=300

data:
  datadir: data/Data1          # folder holding Round1_Setup.json, *_Pos.npy, ...
  scaler_mode: std             # channel normalisation: "std" or "max"

model:
  name: path_field             # registered backend (path_field | wrfgs)
  n_paths: 256                 # K propagation modes (CP rank)
  n_freqs: 10                  # Fourier positional-encoding octaves
  hidden_dim: 256
  n_layers: 4

train:
  epochs: 200
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.0
  lambda_pas: 1.0              # weight of the (1 - C1) PAS-consistency term
  lambda_pdp: 1.0              # weight of the (1 - C2) PDP-consistency term
  val_fraction: 0.1
  grad_clip: 1.0
  num_workers: 0              # keep 0 on Windows unless you guard __main__
  log_every: 10
  seed: 0
  device: null                # null = auto (cuda if available else cpu)

output:
  ckpt: checkpoints/round1_path_field.pt
